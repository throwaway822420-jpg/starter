name: Android wallpaper

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (physics checks and render snapshots)
        run: ./gradlew --no-daemon :core:test testDebugUnitTest :desktop:test

      - name: Build APK
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk HydrophobicCollapse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HydrophobicCollapse-apk
          path: |
            android/HydrophobicCollapse.apk
            android/app/build/snapshots/*.png

      - name: Publish to the wallpaper-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wallpaper-latest --cleanup-tag --yes || true
          gh release create wallpaper-latest HydrophobicCollapse.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Hydrophobic Collapse wallpaper (latest build)" \
            --notes "Android: download HydrophobicCollapse.apk on your device and open it to install. Windows: download HydrophobicCollapse-Windows.zip, unzip it and run HydrophobicCollapse.exe (no Java needed). Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}."

  windows:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Windows app (bundles its own Java runtime)
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon :desktop:installDist
          jpackage --type app-image `
            --input desktop/build/install/HydrophobicCollapse/lib `
            --main-jar desktop.jar `
            --main-class com.hydrophobiccollapse.desktop.MainKt `
            --name HydrophobicCollapse `
            --java-options "-Dsun.java2d.uiScale.enabled=true" `
            --dest dist
          Compress-Archive -Path dist/HydrophobicCollapse -DestinationPath HydrophobicCollapse-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HydrophobicCollapse-Windows
          path: android/HydrophobicCollapse-Windows.zip

      - name: Add to the wallpaper-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload wallpaper-latest HydrophobicCollapse-Windows.zip --clobber
